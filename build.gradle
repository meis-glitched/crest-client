plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3'
}

version = mod_version
group = maven_group

base {
    archivesName = 'crest-client'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://jitpack.io' }
}

configurations {
    shadow
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    shadow 'dev.arbjerg:lavaplayer:2.2.6'
    implementation 'dev.arbjerg:lavaplayer:2.2.6'

    compileOnly files("run/mods/sodium-fabric-0.9.1+mc26.1.2.jar")

    compileOnly "io.github.llamalad7:mixinextras-fabric:0.5.4"
    implementation "io.github.llamalad7:mixinextras-fabric:0.5.4"

    // Phase 1: Foundation - Logging & Error Handling
    shadow 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    shadow 'ch.qos.logback:logback-classic:1.4.11'
    implementation 'ch.qos.logback:logback-classic:1.4.11'

    // Phase 1: Foundation - Utilities
    shadow 'com.google.guava:guava:32.1.3-jre'
    implementation 'com.google.guava:guava:32.1.3-jre'
    shadow 'org.apache.commons:commons-lang3:3.13.0'
    implementation 'org.apache.commons:commons-lang3:3.13.0'

    // Phase 1: Foundation - Networking
    shadow 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Phase 2: Features - Music Player
    shadow 'org.xerial:sqlite-jdbc:3.43.0.0'
    implementation 'org.xerial:sqlite-jdbc:3.43.0.0'
    shadow 'net.jthink:jaudiotagger:3.0.1'
    implementation 'net.jthink:jaudiotagger:3.0.1'
    shadow 'com.github.wendykierp:JTransforms:3.1'
    implementation 'com.github.wendykierp:JTransforms:3.1'

    // Phase 2: Features - QR Codes (optional)
    shadow 'com.google.zxing:core:3.5.2'
    implementation 'com.google.zxing:core:3.5.2'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.shadow]
    dependencies {
        exclude(dependency('org.slf4j:slf4j-api'))
    }
    
    relocate 'com.google.common', 'com.crest.client.lib.guava'
    relocate 'okhttp3', 'com.crest.client.lib.okhttp'
    relocate 'org.apache.commons', 'com.crest.client.lib.commons'
    relocate 'org.xerial', 'com.crest.client.lib.xerial'
    relocate 'com.google.zxing', 'com.crest.client.lib.zxing'
}

jar {
    archiveClassifier.set('slim')
}

tasks.withType(JavaCompile).configureEach {
    // Mixin (sponge-mixin 0.17.x) tops out at compatibilityLevel JAVA_25 (class v69);
    // compiling at 26 produced v70 mixins that trip its class-version check.
    it.options.release = 25
}

java {
    withSourcesJar()
}

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}

tasks.named("runClient", JavaExec).configure {
    jvmArgs "-Xmx${project.findProperty('mc_memory') ?: '2G'}"
    if (project.hasProperty("mc_username")) {
        args "--username", project.getProperty("mc_username")
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

// ═══════════════════════════════════════════════════════════════════════════
// CrestRender (Reticulum) - Rust Native Renderer Build Tasks
// ═══════════════════════════════════════════════════════════════════════════

task buildRustNative(type: Exec) {
    description = 'Builds the CrestRender Rust native library'
    group = 'crestrender'
    workingDir 'native'
    
    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    commandLine = isWindows 
        ? ['cmd', '/c', 'cargo', 'build', '--release']
        : ['cargo', 'build', '--release']
    
    // Only rebuild if Rust sources changed
    inputs.dir('native/src')
    inputs.file('native/Cargo.toml')
    outputs.file('native/target/release/libcrestrender.so')
}

task copyRustNative(type: Copy, dependsOn: buildRustNative) {
    description = 'Copies CrestRender native library to resources'
    group = 'crestrender'
    
    from 'native/target/release/libcrestrender.so'
    into 'src/main/resources/natives/linux/x86_64/'
    
    doLast {
        logger.lifecycle("✓ CrestRender native library copied to resources")
    }
}

// Hook into processResources so native lib is always bundled
processResources.dependsOn copyRustNative

task cleanRustNative(type: Exec) {
    description = 'Cleans CrestRender Rust build artifacts'
    group = 'crestrender'
    workingDir 'native'
    
    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    commandLine = isWindows 
        ? ['cmd', '/c', 'cargo', 'clean']
        : ['cargo', 'clean']
}

clean.dependsOn cleanRustNative
